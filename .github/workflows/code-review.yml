name: AI Code Review

# Example of using this project's own CLI as a CI gate on pull requests.
# Requires a GROQ_API_KEY secret set on the repository (free — see README).
on:
  pull_request:
    paths:
      - "**.js"
      - "**.jsx"
      - "**.ts"
      - "**.tsx"

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - name: Review changed files
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }} -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if [ -z "$FILES" ]; then
            echo "No matching files changed."
            exit 0
          fi
          npm run review -- $FILES --fail-on critical
